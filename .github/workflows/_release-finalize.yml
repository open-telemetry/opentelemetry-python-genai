name: _Release finalize
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      on_main:
        required: false
        type: boolean
        default: false
      sync_main:
        required: false
        type: boolean
        default: true
      bump_after_release:
        required: false
        type: boolean
        default: false
    secrets:
      OTELBOT_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  finalize:
    permissions:
      contents: write
    runs-on: cncf-ubuntu-2-8-x86
    steps:
      - name: Resolve release target
        id: target
        run: |
          if [[ "${{ inputs.on_main }}" == "true" || "$GITHUB_REF_NAME" == "main" ]]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == package-release/${INPUTS_PACKAGE}/v* ]]; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "Run on main or package-release/${INPUTS_PACKAGE}/v*"
            exit 1
          fi
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set environment variables
        run: |
          version=$(./scripts/eachdist.py version --package "${INPUTS_PACKAGE}")
          if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}.$((patch - 1))"
            fi
          elif [[ $version =~ ^([0-9]+)\.([0-9]+)b([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}b$((patch - 1))"
            fi
          else
            echo "unexpected version: $version"
            exit 1
          fi

          path=$(./scripts/eachdist.py find-package --package "${INPUTS_PACKAGE}")
          echo "CHANGELOG=./$path/CHANGELOG.md" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${INPUTS_PACKAGE}" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "RELEASE_TAG=${INPUTS_PACKAGE}==$version" >> $GITHUB_ENV
          echo "PRIOR_VERSION_WHEN_PATCH=$prior_version_when_patch" >> $GITHUB_ENV
          if [[ "${STEPS_TARGET_OUTPUTS_ON_MAIN}" == "true" ]]; then
            echo "RELEASE_TARGET=main" >> $GITHUB_ENV
          else
            echo "RELEASE_TARGET=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}
          STEPS_TARGET_OUTPUTS_ON_MAIN: ${{ steps.target.outputs.on_main }}

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/generate_release_notes.sh

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create --target "$RELEASE_TARGET" \
                            --title "${PACKAGE_NAME} ${VERSION}" \
                            --notes-file /tmp/release-notes.txt \
                            "$RELEASE_TAG"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.sync_main
        with:
          ref: main
          persist-credentials: true # zizmor: ignore[artipacked] a later step pushes the release update branch

      - name: Install uv
        if: inputs.sync_main
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Copy changelog updates to main
        if: inputs.sync_main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/merge_changelog_to_main.sh

      - name: Bump package version on main after release
        if: inputs.sync_main && inputs.bump_after_release && steps.target.outputs.on_main == 'true'
        run: uv run ./scripts/version_utils.py bump --dev

      - name: Regenerate instrumentations README
        if: inputs.sync_main
        run: python ./scripts/generate_instrumentation_readme.py

      - name: Use CLA approved github bot
        if: inputs.sync_main
        run: .github/scripts/use-cla-approved-github-bot.sh

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: inputs.sync_main
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Open pull request for post-release updates on main
        if: inputs.sync_main
        env:
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        run: |
          if git diff --quiet; then
            echo "No updates needed on main"
            exit 0
          fi

          if [[ -n "$PRIOR_VERSION_WHEN_PATCH" ]]; then
            message="Finalize patch release for ${PACKAGE_NAME} v${VERSION}"
            body="Copy patch changelog updates to main and regenerate instrumentation README for \`${PACKAGE_NAME}\` v\`${VERSION}\`."
          else
            message="Finalize release for ${PACKAGE_NAME} v${VERSION}"
            body="Regenerate instrumentation README and bump package versions to next dev version after releasing \`${PACKAGE_NAME}\` v\`${VERSION}\`."
          fi
          branch="otelbot/finalize-${PACKAGE_NAME}-${VERSION}"

          git commit -a -m "$message"
          git push origin HEAD:"$branch"
          gh pr create --title "$message" \
                       --body "$body" \
                       --head "$branch" \
                       --base main \
                       --label "Skip Changelog"
