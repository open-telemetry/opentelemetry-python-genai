name: "Release package"
on:
  workflow_dispatch:
    inputs:
      package:
        type: choice
        options:
        - opentelemetry-instrumentation-genai-agno
        - opentelemetry-instrumentation-genai-anthropic
        - opentelemetry-instrumentation-genai-bedrock
        - opentelemetry-instrumentation-genai-dspy
        - opentelemetry-instrumentation-google-genai
        - opentelemetry-instrumentation-genai-langchain
        - opentelemetry-instrumentation-genai-llama-index
        - opentelemetry-instrumentation-genai-openai-agents
        - opentelemetry-instrumentation-genai-openai
        - opentelemetry-instrumentation-genai-portkey
        - opentelemetry-instrumentation-genai-qwen-agent
        - opentelemetry-instrumentation-genai-qwenpaw
        - opentelemetry-instrumentation-genai-smolagents
        - opentelemetry-util-genai
        description: 'Package to release'
        required: true

permissions:
  contents: read

run-name: "Release: ${{ inputs.package }}"

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: $/.github/workflows/_release-build.yml
    with:
      package: ${{ inputs.package }}

  publish:
    needs: build
    runs-on: cncf-ubuntu-2-8-x86
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          attestations: true

  finalize:
    needs: [build, publish]
    permissions:
      contents: write
    uses: $/.github/workflows/_release-finalize.yml
    with:
      package: ${{ inputs.package }}
      ref: ${{ needs.build.outputs.built_sha }}
      bump_after_release: true
    secrets:
      OTELBOT_PRIVATE_KEY: ${{ secrets.OTELBOT_PRIVATE_KEY }}
