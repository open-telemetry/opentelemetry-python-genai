name: Misc

on:
  workflow_call:

permissions:
  contents: read

env:
  # Set the SHA to the branch name if the PR has a label 'prepare-release' or 'backport' otherwise, set it to 'main'
  # For PRs you can change the inner fallback ('main')
  # For pushes you change the outer fallback ('main')
  # The logic below is used during releases and depends on having an equivalent branch name in the core repo.
  CORE_REPO_SHA: ${{ github.event_name == 'pull_request' && (
       contains(github.event.pull_request.labels.*.name, 'prepare-release') && github.event.pull_request.head.ref ||
       contains(github.event.pull_request.labels.*.name, 'backport') && github.event.pull_request.base.ref ||
       'main'
    ) || 'main' }}
  CONTRIB_REPO_SHA: main
  PIP_EXISTS_ACTION: w

jobs:

  spellcheck:
    name: spellcheck
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run spellcheck
        run: uvx --with tox-uv tox -e spellcheck

  docs:
    name: docs
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: |
      github.event.pull_request.user.login != 'otelbot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The docs env installs weaviate-client, whose grpcio cap has no Python 3.15 wheels.
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Build docs
        run: uvx --with tox-uv tox -e docs

  generate:
    name: generate
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run generate
        run: uvx --with tox-uv tox -e generate

      - name: Check generated files are up to date
        run: git diff --exit-code || (echo 'Generated code is out of date, run "tox -e generate" and commit the changes in this PR.' && exit 1)

  readme:
    name: readme
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check READMEs render on PyPI
        run: uvx --with tox-uv tox -e readme

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run shellcheck
        run: uvx --with tox-uv tox -e shellcheck

  precommit:
    name: precommit
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run pre-commit
        run: uvx --with tox-uv tox -e precommit

  typecheck:
    name: typecheck
    runs-on: cncf-ubuntu-2-8-x86
    timeout-minutes: 30
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run typecheck
        run: uvx --with tox-uv tox -e typecheck

  typecheck-py314:
    name: typecheck-py314
    runs-on: cncf-ubuntu-2-8-x86
    timeout-minutes: 30
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # crewai and weaviate-client deps have no Python 3.15 wheels yet (see tox.ini).
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run typecheck
        run: uvx --with tox-uv tox -e typecheck-py314

  deps-check:
    name: deps-check
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"

      - name: Run dependency check
        run: uv run --no-project --with packaging scripts/check_deps.py

      - name: Test workspace dependency validation
        run: uv run --no-project --with packaging python -m unittest discover -s scripts/tests -v

      - name: Check generated Anthropic requirements
        id: anthropic-locks
        run: |
          uv pip compile --no-config --no-sources --universal --no-annotate --python-version=3.11 --resolution=lowest-direct \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.oldest.in \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.test.in \
            --output-file=instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/locks/requirements.oldest.txt
          uv pip compile --no-config --no-sources --universal --no-annotate --python-version=3.11 \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.latest.in \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.test.in \
            --output-file=instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/locks/requirements.latest.txt
          uv pip compile --no-config --no-sources --universal --no-annotate --python-version=3.15 \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.latest.in \
            instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/requirements.test.in \
            --output-file=instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/locks/py315/requirements.latest.txt
          git diff --binary --output="$RUNNER_TEMP/anthropic-locks.patch" -- instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/locks
          git diff --exit-code -- instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/locks

      - name: Upload regenerated requirements patch
        if: failure() && steps.anthropic-locks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anthropic-locks
          path: ${{ runner.temp }}/anthropic-locks.patch
          if-no-files-found: ignore

  check-util-api:
    name: check-util-api
    runs-on: ubuntu-slim
    timeout-minutes: 10
    if: |
      !contains(github.event.pull_request.labels.*.name, 'Approve Public API check')
      && github.event.pull_request.user.login != 'otelbot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # griffe needs the PR base branch available for comparison.
          fetch-depth: 0

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check util public API
        run: uvx --with tox-uv tox -e check-util-api

  license-header-check:
    name: license-header-check
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check license headers
        run: uvx --with tox-uv tox -e license-header-check

  check-versions:
    name: check-versions
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.15
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check versions
        run: uvx --with tox-uv tox -e check-versions


