name: _Release build
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      on_main:
        required: false
        type: boolean
        default: false
    outputs:
      built_sha:
        description: "Verified commit SHA used for the build"
        value: ${{ jobs.build.outputs.built_sha }}

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-slim
    outputs:
      built_sha: ${{ steps.verify_commit.outputs.sha }}
    steps:
      - name: Resolve release target
        id: target
        run: |
          if [[ "${{ inputs.on_main }}" == "true" || "$GITHUB_REF_NAME" == "main" ]]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == package-release/${INPUTS_PACKAGE}/v* ]]; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "Run on main or package-release/${INPUTS_PACKAGE}/v*"
            exit 1
          fi
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Verify commit belongs to a merged pull request
        id: verify_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          built_sha=$(git rev-parse HEAD)
          echo "sha=${built_sha}" >> "$GITHUB_OUTPUT"
          if [[ "${built_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Error! Resolved commit ${built_sha} differs from attested source SHA ${GITHUB_SHA}."
            exit 1
          fi
          merged_prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${built_sha}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [[ "${merged_prs}" -lt 1 ]]; then
            echo "Error! Commit ${built_sha} is not associated with any merged pull request."
            exit 1
          fi

      - name: Set environment variables
        run: |
          version=$(./scripts/eachdist.py version --package "${INPUTS_PACKAGE}")
          if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}.$((patch - 1))"
            fi
          elif [[ $version =~ ^([0-9]+)\.([0-9]+)b([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}b$((patch - 1))"
            fi
          else
            echo "unexpected version: $version"
            exit 1
          fi

          if [[ "${STEPS_TARGET_OUTPUTS_ON_MAIN}" == "true" && "$version" == *.dev ]]; then
            echo "version on main still has a .dev suffix; merge the prepare PR first"
            exit 1
          fi

          path=$(./scripts/eachdist.py find-package --package "${INPUTS_PACKAGE}")
          echo "CHANGELOG=./$path/CHANGELOG.md" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${INPUTS_PACKAGE}" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "PRIOR_VERSION_WHEN_PATCH=$prior_version_when_patch" >> $GITHUB_ENV
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}
          STEPS_TARGET_OUTPUTS_ON_MAIN: ${{ steps.target.outputs.on_main }}

      - name: Check that changelog section exists for release version
        run: |
          if ! grep --quiet "^## Version ${VERSION}" "${CHANGELOG}"; then
            echo "Missing '## Version ${VERSION}' in ${CHANGELOG}; merge the prepare PR first"
            exit 1
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build wheels
        run: ./scripts/build_a_package.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
