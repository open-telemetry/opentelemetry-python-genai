name: _Release build
on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ""
      on_main:
        required: false
        type: boolean
        default: false
    outputs:
      built_sha:
        description: "Verified commit SHA used for the build"
        value: ${{ jobs.build.outputs.built_sha }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    outputs:
      built_sha: ${{ steps.build_commit.outputs.sha }}
    steps:
      - name: Resolve release target
        id: target
        run: |
          if [[ "${{ inputs.on_main }}" == "true" || "$GITHUB_REF_NAME" == "main" ]]; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" == package-release/${INPUTS_PACKAGE}/v* ]]; then
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          else
            echo "Run on main or package-release/${INPUTS_PACKAGE}/v*"
            exit 1
          fi
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          persist-credentials: false

      - name: Record build commit SHA
        id: build_commit
        run: |
          built_sha=$(git rev-parse HEAD)
          echo "sha=${built_sha}" >> "$GITHUB_OUTPUT"

      - name: Set environment variables
        run: |
          version=$(./scripts/eachdist.py version --package "${INPUTS_PACKAGE}")
          if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}.$((patch - 1))"
            fi
          elif [[ $version =~ ^([0-9]+)\.([0-9]+)b([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            if [[ $patch != 0 ]]; then
              prior_version_when_patch="${major}.${minor}b$((patch - 1))"
            fi
          else
            echo "unexpected version: $version"
            exit 1
          fi

          if [[ "${STEPS_TARGET_OUTPUTS_ON_MAIN}" == "true" && "$version" == *.dev ]]; then
            echo "version on main still has a .dev suffix; merge the prepare PR first"
            exit 1
          fi

          path=$(./scripts/eachdist.py find-package --package "${INPUTS_PACKAGE}")
          echo "CHANGELOG=./$path/CHANGELOG.md" >> $GITHUB_ENV
          echo "PACKAGE_NAME=${INPUTS_PACKAGE}" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "PRIOR_VERSION_WHEN_PATCH=$prior_version_when_patch" >> $GITHUB_ENV
        env:
          INPUTS_PACKAGE: ${{ inputs.package }}
          STEPS_TARGET_OUTPUTS_ON_MAIN: ${{ steps.target.outputs.on_main }}

      - name: Check that changelog section exists for release version
        run: |
          if ! grep --quiet "^## Version ${VERSION}" "${CHANGELOG}"; then
            echo "Missing '## Version ${VERSION}' in ${CHANGELOG}; merge the prepare PR first"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Build wheels
        run: ./scripts/build_a_package.sh

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  attest:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ inputs.package }}
          path: dist/

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
