name: Bump package version
description: >
  Run a version-bump or prepare-release script against a single package, then
  open a pull request with the resulting changes. Dispatch is driven by the
  `operation` input.

inputs:
  package:
    description: Package name (e.g. opentelemetry-instrumentation-genai-openai)
    required: true
  operation:
    description: >
      One of "drop-dev" (drop the .dev suffix and run towncrier on main) or
      "bump-patch" (bump the beta patch component on a backport branch).
    required: true
  otelbot-client-id:
    description: OTELBOT app client id used to open the pull request
    required: true
  otelbot-private-key:
    description: OTELBOT app private key used to open the pull request
    required: true

runs:
  using: composite
  steps:
    - name: Verify branch matches operation
      shell: bash
      run: |
        case "${INPUTS_OPERATION}" in
          drop-dev)
            if [[ "$GITHUB_REF_NAME" != "main" ]]; then
              echo "operation '${INPUTS_OPERATION}' must run on main, got '$GITHUB_REF_NAME'"
              exit 1
            fi
            ;;
          bump-patch)
            if [[ "$GITHUB_REF_NAME" != package-release/${INPUTS_PACKAGE}/v* ]]; then
              echo "operation 'bump-patch' must run on a package-release/${INPUTS_PACKAGE}/v* backport branch, got '$GITHUB_REF_NAME'"
              exit 1
            fi
            ;;
          *)
            echo "unknown operation: '${INPUTS_OPERATION}'"
            exit 1
            ;;
        esac
      env:
        INPUTS_OPERATION: ${{ inputs.operation }}
        INPUTS_PACKAGE: ${{ inputs.package }}

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Run drop-dev
      if: inputs.operation == 'drop-dev'
      shell: bash
      run: ./scripts/prepare_package_for_release.sh "${INPUTS_PACKAGE}"
      env:
        INPUTS_PACKAGE: ${{ inputs.package }}

    - name: Run bump-patch
      if: inputs.operation == 'bump-patch'
      shell: bash
      run: ./scripts/prepare_package_for_patch_release.sh "${INPUTS_PACKAGE}"
      env:
        INPUTS_PACKAGE: ${{ inputs.package }}

    - name: Compute resulting version
      shell: bash
      run: | # zizmor: ignore[github-env] package is a fixed dispatch choice and version comes from a trusted repository script
        version=$(./scripts/eachdist.py version --package "${INPUTS_PACKAGE}")
        echo "VERSION=${version}" >> "$GITHUB_ENV"
        echo "PACKAGE_NAME=${INPUTS_PACKAGE}" >> "$GITHUB_ENV"
      env:
        INPUTS_PACKAGE: ${{ inputs.package }}

    - name: Configure CLA-approved git bot
      shell: bash
      run: .github/scripts/use-cla-approved-github-bot.sh

    - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: otelbot-token
      with:
        client-id: ${{ inputs.otelbot-client-id }}
        private-key: ${{ inputs.otelbot-private-key }}
        permission-pull-requests: write

    - name: Create pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
        INPUTS_OPERATION: ${{ inputs.operation }}
      run: |
        case "${INPUTS_OPERATION}" in
          drop-dev)
            title="Prepare release for ${PACKAGE_NAME} v${VERSION}"
            branch="otelbot/prepare-${PACKAGE_NAME}-v${VERSION}"
            ;;
          bump-patch)
            title="Prepare patch release for ${PACKAGE_NAME} v${VERSION}"
            branch="otelbot/patch-${PACKAGE_NAME}-v${VERSION}"
            ;;
        esac

        git commit -a -m "$title"
        git push origin HEAD:"$branch"
        gh pr create --title "$title" \
                     --body "$title." \
                     --head "$branch" \
                     --base "$GITHUB_REF_NAME"
