# Used for local development, not to be published.
[project]
name = "opentelemetry-python-genai"
version = "0.0.0" # This is not used.
requires-python = ">=3.10"
dependencies = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-semantic-conventions",
  "opentelemetry-instrumentation",
  "opentelemetry-test-utils",
  "opentelemetry-test-util-genai",
  "opentelemetry-util-genai",
  "opentelemetry-instrumentation-genai-agno[instruments]",
  "opentelemetry-instrumentation-genai-anthropic[instruments]",
  "opentelemetry-instrumentation-genai-claude-agent-sdk[instruments]",
  "opentelemetry-instrumentation-genai-crewai[instruments]",
  "opentelemetry-instrumentation-genai-dspy[instruments]",
  "opentelemetry-instrumentation-google-genai[instruments]",
  "opentelemetry-instrumentation-genai-langchain[instruments]",
  "opentelemetry-instrumentation-genai-llama-index[instruments]",
  "opentelemetry-instrumentation-genai-openai[instruments]",
  "opentelemetry-instrumentation-genai-openai-agents[instruments]",
  "opentelemetry-instrumentation-genai-qwen-agent[instruments]",
  "opentelemetry-instrumentation-genai-smolagents[instruments]",
  "opentelemetry-instrumentation-genai-weaviate-client[instruments]",
]


# https://docs.astral.sh/uv/reference/settings/
[tool.uv]
package = false # https://docs.astral.sh/uv/reference/settings/#package
required-version = ">=0.6.0"
# crewai hard-pins the OpenTelemetry core stack to a narrow window
# (opentelemetry-api/-sdk >=1.42,<1.43) that can't coexist with this
# workspace's ~=1.43 floor. Override crewai's caps so the workspace lock
# resolves against the versions the util packages require. This is the
# lock-time analog of the conformance-only UV_OVERRIDE wired in tox.ini.
override-dependencies = [
  "opentelemetry-api ~= 1.43",
  "opentelemetry-sdk ~= 1.43",
]

# https://docs.astral.sh/uv/reference/settings/#sources
[tool.uv.sources]
opentelemetry-test-util-genai = { workspace = true }
opentelemetry-util-genai = { workspace = true }
opentelemetry-instrumentation-genai-agno = { workspace = true }
opentelemetry-instrumentation-genai-anthropic = { workspace = true }
opentelemetry-instrumentation-genai-claude-agent-sdk = { workspace = true }
opentelemetry-instrumentation-genai-crewai = { workspace = true }
opentelemetry-instrumentation-genai-dspy = { workspace = true }
opentelemetry-instrumentation-google-genai = { workspace = true }
opentelemetry-instrumentation-genai-langchain = { workspace = true }
opentelemetry-instrumentation-genai-llama-index = { workspace = true }
opentelemetry-instrumentation-genai-openai = { workspace = true }
opentelemetry-instrumentation-genai-openai-agents = { workspace = true }
opentelemetry-instrumentation-genai-qwen-agent = { workspace = true }
opentelemetry-instrumentation-genai-smolagents = { workspace = true }
opentelemetry-instrumentation-genai-weaviate-client = { workspace = true }


# https://docs.astral.sh/uv/reference/settings/#workspace
[tool.uv.workspace]
members = [
  "instrumentation/*",
  "util/opentelemetry-test-util-genai",
  "util/opentelemetry-util-genai",
]

[tool.ruff]
# https://docs.astral.sh/ruff/configuration/
line-length = 79
force-exclude = true
extend-exclude = ["*_pb2*.py*"]
output-format = "concise"
extension = { added = "markdown", changed = "markdown", deprecated = "markdown", removed = "markdown", fixed = "markdown" }

[tool.ruff.lint]
# https://docs.astral.sh/ruff/linter/#rule-selection
# pylint: https://github.com/astral-sh/ruff/issues/970
# Ignore rules from the default ruleset that don't have auto-fixes available and need to be
# manually resolved, plus E501 and RUF023 which are intentionally ignored.
ignore = [
  "B008", "B009", "B010", "B017", "B018", "B020", "B023", "B026", "B039",
  "BLE001", "C401", "C408", "C417", "DTZ005", "DTZ007", "E501", "FLY002",
  "ISC004", "LOG015", "PERF102", "PERF402", "PIE796", "PLW0602", "PLW1508",
  "PT014", "PYI034", "PYI036", "RUF009", "RUF012", "RUF013", "RUF015",
  "RUF023", "RUF059", "S102", "S110", "S112", "SIM102", "SIM103", "SIM115",
  "SIM117", "SIM118", "SIM210", "TRY002", "TRY004", "TRY201", "TRY401",
  "UP007",
]

[tool.ruff.lint.per-file-ignores]
"docs/**/*.*" = ["A001"]
"instrumentation/opentelemetry-instrumentation-google-genai/tests/*" = ["TID252"]

[tool.ruff.lint.isort]
detect-same-package = false # to not consider instrumentation packages as first-party
known-first-party = ["opentelemetry"]
known-third-party = [
  "pytest",
]

[tool.ruff.format]
docstring-code-format = true


# https://github.com/microsoft/pyright/blob/main/docs/configuration.md#type-check-rule-overrides
[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true
reportMissingTypeStubs = false
pythonVersion = "3.10"
reportPrivateUsage = false  # Ignore private attributes added by instrumentation packages.
reportDeprecated = false  # Ignore deprecation on GenAI enums in opentelemetry.semconv 0.64b0 until semconv-genai python package is published.
# Add progressively instrumentation packages here.
include = [
  "instrumentation/opentelemetry-instrumentation-genai-agno",
  "instrumentation/opentelemetry-instrumentation-genai-anthropic",
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk",
  "instrumentation/opentelemetry-instrumentation-genai-crewai",
  "instrumentation/opentelemetry-instrumentation-genai-dspy",
  "instrumentation/opentelemetry-instrumentation-genai-langchain",
  "instrumentation/opentelemetry-instrumentation-genai-llama-index",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents",
  "instrumentation/opentelemetry-instrumentation-genai-qwen-agent",
  "instrumentation/opentelemetry-instrumentation-genai-weaviate-client",
  "util/opentelemetry-util-genai",
]
# We should also add type hints to the test suite - It helps on finding bugs.
# We are excluding for now because it's easier, and more important to add to the instrumentation packages.
exclude = [
  "**/dev/**",
  "**/.venv/**",
  "instrumentation/opentelemetry-instrumentation-genai-agno/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-agno/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-anthropic/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-anthropic/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-claude-agent-sdk/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-crewai/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-crewai/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-dspy/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-dspy/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-langchain/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-langchain/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-llama-index/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-llama-index/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-openai-agents/examples/**",
  "instrumentation/opentelemetry-instrumentation-genai-qwen-agent/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-qwen-agent/examples/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-weaviate-client/tests/**/*.py",
  "instrumentation/opentelemetry-instrumentation-genai-weaviate-client/examples/**/*.py",
  "util/opentelemetry-util-genai/tests/**/*.py",
]

[dependency-groups]
dev = [
    "tox",
    "tox-uv>=1",
    "pre-commit",
    "towncrier",
]
