runner: genai-conformance
weaver:
  registry: https://github.com/open-telemetry/semantic-conventions-genai.git@${SEMCONV_GENAI_REF}[model]
instrumented_library: dspy
instrumentation_library: opentelemetry-instrumentation-genai-dspy
env:
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY
scenarios:
  react:
    run: opentelemetry-instrument python react.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
        expect:
          count: 1
    metrics:
      - gen_ai.execute_tool.duration
      - gen_ai.invoke_agent.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: Agent spans do not report finish reasons.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: Agent spans do not report aggregated token usage.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: Agent spans do not report aggregated token usage.
  react_v2:
    run: opentelemetry-instrument python react_v2.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
        expect:
          count: 1
    metrics:
      - gen_ai.execute_tool.duration
      - gen_ai.invoke_agent.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: Agent spans do not report finish reasons.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: Agent spans do not report aggregated token usage.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: Agent spans do not report aggregated token usage.
  retrieve:
    run: opentelemetry-instrument python retrieve.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: retrieval
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: retrieval
          missing_attribute: server.address
        reason: The instrumentation does not provide server.address.
  colbert:
    run: opentelemetry-instrument python colbert.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: retrieval
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
  embeddings_retrieval:
    run: opentelemetry-instrument python embeddings_retrieval.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: retrieval
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: retrieval
          missing_attribute: server.address
        reason: The instrumentation does not provide server.address.
  tool:
    run: opentelemetry-instrument python tool.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
        expect:
          count: 1
    metrics:
      - gen_ai.execute_tool.duration
