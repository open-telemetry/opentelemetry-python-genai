runner: genai-conformance
instrumented_library: boto3
instrumentation_library: opentelemetry-instrumentation-genai-bedrock

weaver:
  registry: https://github.com/open-telemetry/semantic-conventions-genai.git@${SEMCONV_GENAI_REF}[model]

server:
  run: genai-mock-server --port ${PORT}

env:
  AWS_ENDPOINT_URL_BEDROCK_AGENT_RUNTIME: ${MOCK_SERVER_URL}
  AWS_ENDPOINT_URL_BEDROCK_RUNTIME: ${MOCK_SERVER_URL}
  AWS_ACCESS_KEY_ID: test_access_key_id
  AWS_SECRET_ACCESS_KEY: test_secret_access_key
  AWS_DEFAULT_REGION: us-east-1
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  inference:
    run: opentelemetry-instrument python inference.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response ID
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  streaming:
    run: opentelemetry-instrument python streaming.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response ID
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  tool_calling:
    run: opentelemetry-instrument python tool_calling.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response ID
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  invoke_model:
    run: opentelemetry-instrument python invoke_model.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response ID
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  invoke_model_streaming:
    run: opentelemetry-instrument python invoke_model_streaming.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response ID
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  retrieve_and_generate_streaming:
    run: opentelemetry-instrument python retrieve_and_generate_streaming.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: The instrumentation does not provide gen_ai.response.id.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: The instrumentation does not provide gen_ai.response.model.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.input_tokens
        reason: The instrumentation does not provide gen_ai.usage.input_tokens.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.output_tokens
        reason: The instrumentation does not provide gen_ai.usage.output_tokens.

  embedding:
    run: opentelemetry-instrument python embedding.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: embeddings
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: embeddings
          missing_attribute: gen_ai.response.model
        reason: The instrumentation does not provide gen_ai.response.model.
      - id: genai_expected_attribute_missing
        context:
          operation: embeddings
          missing_attribute: gen_ai.request.encoding_formats
        reason: The Titan embeddings API does not accept an encoding format.

  retrieve_and_generate:
    run: opentelemetry-instrument python retrieve_and_generate.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: The instrumentation does not provide gen_ai.response.id.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: The instrumentation does not provide gen_ai.response.model.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.input_tokens
        reason: The instrumentation does not provide gen_ai.usage.input_tokens.
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.usage.output_tokens
        reason: The instrumentation does not provide gen_ai.usage.output_tokens.

  retrieve:
    run: opentelemetry-instrument python retrieve.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: retrieval
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration

  invoke_agent:
    run: opentelemetry-instrument python invoke_agent.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.operation.time_to_first_chunk
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: Agent spans do not report finish reasons.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: Agent spans do not report aggregated token usage.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: Agent spans do not report aggregated token usage.
