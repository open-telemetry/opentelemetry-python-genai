runner: genai-conformance
instrumented_library: smolagents
instrumentation_library: opentelemetry-instrumentation-genai-smolagents

weaver:
  registry: https://github.com/open-telemetry/semantic-conventions-genai.git@${SEMCONV_GENAI_REF}[model]

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  inference:
    run: opentelemetry-instrument python inference.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: server.address
        reason: does not listen on socket
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response id
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not return finish reasons
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  streaming:
    run: opentelemetry-instrument python streaming.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: server.address
        reason: does not listen on socket
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response id
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not return finish reasons
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  tool_calling:
    run: opentelemetry-instrument python tool_calling.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: server.address
        reason: does not listen on socket
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response id
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not return finish reasons
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
          attributes:
            gen_ai.tool.definitions:
              present: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  multimodal:
    run: opentelemetry-instrument python multimodal.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: server.address
        reason: does not listen on socket
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.id
        reason: does not return response id
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.model
        reason: does not return response model
      - id: genai_expected_attribute_missing
        context:
          operation: chat
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not return finish reasons
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.input.messages:
              present: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  agent:
    run: opentelemetry-instrument python agent.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
    metrics:
      - gen_ai.invoke_agent.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: Agent spans do not report aggregated token usage.
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: Agent spans do not report aggregated token usage.
