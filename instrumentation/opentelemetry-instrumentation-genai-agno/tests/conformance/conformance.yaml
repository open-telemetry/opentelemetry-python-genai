runner: genai-conformance
instrumented_library: agno
instrumentation_library: opentelemetry-instrumentation-genai-agno

weaver:
  registry: https://github.com/open-telemetry/semantic-conventions-genai.git@${SEMCONV_GENAI_REF}[model]

env:
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  invoke_agent:
    run: opentelemetry-instrument python invoke_agent.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not emit finish reasons
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: does not emit input tokens
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: does not emit output tokens
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
        expect:
          count: 1
    metrics:
      - gen_ai.invoke_agent.duration
      - gen_ai.execute_tool.duration

  workflow:
    run: opentelemetry-instrument python workflow.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_workflow
        expect:
          count: 1
    metrics:
      - gen_ai.invoke_workflow.duration

  retrieval:
    run: opentelemetry-instrument python retrieval.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: retrieval
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: retrieval
          missing_attribute: server.address
        reason: The instrumentation does not provide server.address.

  workflow_streaming:
    run: opentelemetry-instrument python workflow_streaming.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_workflow
        expect:
          count: 1
    metrics:
      - gen_ai.invoke_workflow.duration
