runner: genai-conformance
instrumented_library: llama-index
instrumentation_library: opentelemetry-instrumentation-genai-llama-index

# TODO: point at the pin directly once the runner takes a Git URL with a ref -
# https://github.com/open-telemetry/semantic-conventions-conformance/issues/176
weaver:
  registry: ../../../../.semconv/model

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_API_BASE: ${MOCK_SERVER_URL}/v1
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  invoke_agent:
    run: opentelemetry-instrument python invoke_agent.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not surface finish reasons
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: does not surface input tokens
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: does not surface output tokens
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration

  react_agent:
    run: opentelemetry-instrument python react_agent.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not surface finish reasons
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: does not surface input tokens
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: does not surface output tokens
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration

  automatic_tool_calling:
    run: opentelemetry-instrument python automatic_tool_calling.py
    expected_violations:
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.response.finish_reasons
        reason: does not surface finish reasons
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.input_tokens
        reason: does not surface input tokens
      - id: genai_expected_attribute_missing
        context:
          operation: invoke_agent
          missing_attribute: gen_ai.usage.output_tokens
        reason: does not surface output tokens
    spans:
      - match:
          attributes:
            gen_ai.operation.name: invoke_agent
        expect:
          count: 1
      - match:
          attributes:
            gen_ai.operation.name: execute_tool
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
