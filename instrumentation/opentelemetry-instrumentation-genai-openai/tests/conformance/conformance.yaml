runner: genai-conformance
instrumented_library: openai
instrumentation_library: opentelemetry-instrumentation-genai-openai

# TODO: point at the pin directly once the runner takes a Git URL with a ref -
# https://github.com/open-telemetry/semantic-conventions-conformance/issues/176
weaver:
  registry: ../../../../.semconv/model

server:
  run: genai-mock-server --port ${PORT}

env:
  OPENAI_BASE_URL: ${MOCK_SERVER_URL}/v1
  OPENAI_API_KEY: test_openai_api_key
  OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: SPAN_ONLY

scenarios:
  inference:
    run: opentelemetry-instrument python inference.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  streaming:
    run: opentelemetry-instrument python streaming.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  embeddings:
    run: opentelemetry-instrument python embeddings.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: embeddings
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  tool_calling:
    run: opentelemetry-instrument python tool_calling.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  responses_conversation:
    run: opentelemetry-instrument python responses_conversation.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  responses_fetch:
    run: opentelemetry-instrument python responses_fetch.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: fetch_response
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration

  responses_tool_calling:
    run: opentelemetry-instrument python responses_tool_calling.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 2
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  responses_stream:
    run: opentelemetry-instrument python responses_stream.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  responses_streaming:
    run: opentelemetry-instrument python responses_streaming.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
          attributes:
            gen_ai.request.stream: true
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
      - gen_ai.client.operation.time_to_first_chunk
      - gen_ai.client.operation.time_per_output_chunk

  structured_output:
    run: opentelemetry-instrument python structured_output.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage

  multimodal:
    run: opentelemetry-instrument python multimodal.py
    spans:
      - match:
          attributes:
            gen_ai.operation.name: chat
        expect:
          count: 1
    metrics:
      - gen_ai.client.operation.duration
      - gen_ai.client.token.usage
